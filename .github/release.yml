changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 修复
      labels:
        - bug
    - title: 文档
      labels:
        - documentation
    - title: 依赖更新
      labels:
        - dependencies
    - title: 其他变更
      labels:
        - "*"
